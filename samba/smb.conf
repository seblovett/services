# Samba configuration for the VPN-only stack.
# Mounted at /etc/samba/smb.conf in the "samba" container. Users come from
# users.conf (see users.conf.example). Run `docker exec samba testparm -s`
# after editing to check it parses.

[global]
    workgroup = WORKGROUP
    server string = NAS
    server role = standalone server
    security = user
    passdb backend = tdbsam

    # No guest access, ever.
    map to guest = Never

    # Only the Docker proxy network. Because wg-easy NATs VPN traffic, every
    # client appears to come from an address in this subnet. Keep in sync
    # with the proxy subnet in docker-compose.yml.
    hosts allow = 172.20.0.0/24
    hosts deny = 0.0.0.0/0

    # Modern SMB only. Change "desired" to "required" to refuse clients that
    # can't do SMB3 encryption (the WireGuard tunnel is encrypted already).
    server min protocol = SMB3
    server smb encrypt = desired

    # SMB over TCP 445 only; no NetBIOS name service, no printing.
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[Share]
    path = /storage
    browseable = yes
    read only = no
    guest ok = no
    valid users = @smbusers
    force group = smbusers
    create mask = 0660
    directory mask = 0770
